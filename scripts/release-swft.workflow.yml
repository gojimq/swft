name: Release Swft

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact semver release version without leading 'v' (e.g. 0.2.0)"
        required: true
        type: string
      notes:
        description: "Optional release notes markdown"
        required: false
        type: string
        default: ""
      draft:
        description: "Create as a draft release"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-swft-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-macos-arm64:
    name: Build & Publish Swft (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve and validate release version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid semver version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.13.1"

      - name: Enable Corepack / pnpm
        shell: bash
        run: corepack enable

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install workspace dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Stamp version into Info.plist and apps/server/package.json
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION}" apps/macos/Resources/Info.plist
          node -e '
            const fs = require("node:fs");
            const file = "apps/server/package.json";
            const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
            pkg.version = process.env.VERSION;
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n");
          '

      - name: Build web client, server bundle, and resource monitor
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/vp run --filter @t3tools/web build
          node apps/server/scripts/cli.ts build
          cargo build --locked --release \
            --manifest-path native/resource-monitor/Cargo.toml \
            --target aarch64-apple-darwin
          mkdir -p "$RUNNER_TEMP/resource-monitor/darwin-arm64"
          cp native/resource-monitor/target/aarch64-apple-darwin/release/t3-resource-monitor \
            "$RUNNER_TEMP/resource-monitor/darwin-arm64/t3-resource-monitor"

      - name: Build server SEA and archive
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          T3CODE_CLI_MAC_SIGN_IDENTITY: ${{ secrets.SWFT_MAC_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          export PATH="$PWD/node_modules/.bin:$PATH"
          node apps/server/scripts/cli.ts build-exe --target darwin-arm64
          mkdir -p "$RUNNER_TEMP/release-assets"
          node scripts/build-cli-archive.ts \
            --platform mac \
            --arch arm64 \
            --version "$VERSION" \
            --resource-monitor-dir "$RUNNER_TEMP/resource-monitor" \
            --output-dir "$RUNNER_TEMP/release-assets"

      - name: Build release Swft.app and embed standalone server runtime
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGN_IDENTITY: ${{ secrets.SWFT_MAC_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          apps/macos/scripts/bundle.sh release
          APP_BUNDLE="apps/macos/build/Swft.app"
          EMBEDDED_SERVER="$APP_BUNDLE/Contents/Resources/server"
          rm -rf "$EMBEDDED_SERVER"
          mkdir -p "$EMBEDDED_SERVER"
          tar -xzf "$RUNNER_TEMP/release-assets/t3-${VERSION}-darwin-arm64.tar.gz" \
            -C "$EMBEDDED_SERVER" --strip-components=1
          chmod +x "$EMBEDDED_SERVER/t3"
          "$EMBEDDED_SERVER/t3" --version

          IDENTITY="${SIGN_IDENTITY:--}"
          SIGN_ARGS=(--force --sign "$IDENTITY")
          if [[ "$IDENTITY" != "-" ]]; then
            SIGN_ARGS+=(--options runtime --timestamp)
          fi
          codesign "${SIGN_ARGS[@]}" "$APP_BUNDLE/Contents/MacOS/Swft"
          codesign "${SIGN_ARGS[@]}" "$APP_BUNDLE"

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_BUNDLE" \
            "$RUNNER_TEMP/release-assets/Swft-${VERSION}-darwin-arm64.zip"

      - name: Generate SHA256SUMS
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release-assets"
          shasum -a 256 \
            "t3-${VERSION}-darwin-arm64.tar.gz" \
            "Swft-${VERSION}-darwin-arm64.zip" \
            > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_NOTES: ${{ inputs.notes }}
          IS_DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          ASSETS=(
            "$RUNNER_TEMP/release-assets/t3-${VERSION}-darwin-arm64.tar.gz"
            "$RUNNER_TEMP/release-assets/Swft-${VERSION}-darwin-arm64.zip"
            "$RUNNER_TEMP/release-assets/SHA256SUMS"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber "${ASSETS[@]}"
          else
            CREATE_ARGS=(release create "$TAG" --title "Swft ${TAG}")
            if [[ "$IS_DRAFT" == "true" ]]; then
              CREATE_ARGS+=(--draft)
            fi
            if [[ -n "$RELEASE_NOTES" ]]; then
              CREATE_ARGS+=(--notes "$RELEASE_NOTES")
            else
              CREATE_ARGS+=(--generate-notes)
            fi
            gh "${CREATE_ARGS[@]}" "${ASSETS[@]}"
          fi
